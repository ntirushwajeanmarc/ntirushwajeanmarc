<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 22" width="1000" height="22" role="img" aria-label="Animated data stream divider">
  <title>data stream divider</title>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="12%" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="88%" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="11" x2="1000" y2="11" stroke="#0e2a38" stroke-width="1"/>
  <line x1="0" y1="11" x2="1000" y2="11" stroke="url(#fade)" stroke-width="2" stroke-dasharray="10 22">
    <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="1.4s" repeatCount="indefinite"/>
  </line>
  <circle r="2.6" cy="11" fill="#7df9ff">
    <animate attributeName="cx" values="-10;1010" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.95;0.95;0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.6" cy="11" fill="#7df9ff" opacity="0.5">
    <animate attributeName="cx" values="1010;-10" dur="13s" repeatCount="indefinite"/>
  </circle>
</svg>
